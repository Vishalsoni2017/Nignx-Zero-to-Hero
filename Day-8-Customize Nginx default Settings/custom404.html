<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>404 - Page Not Found</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f8f9fa;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #202124;
        }

        .container {
            text-align: center;
        }

        h1 {
            font-size: 80px;
            margin: 0;
            color: #4285f4;
        }

        h2 {
            font-size: 24px;
            margin: 10px 0;
        }

        p {
            color: #5f6368;
            font-size: 16px;
        }

        a {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 20px;
            background: #4285f4;
            color: #fff;
            text-decoration: none;
            border-radius: 4px;
            transition: 0.3s;
        }

        a:hover {
            background: #3367d6;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>404</h1>
    <h2>Page Not Found</h2>
    <p>The page you’re looking for doesn’t exist or has been moved.</p>
    <a href="/">Go to Homepage</a>
</div>

</body>
</html>
